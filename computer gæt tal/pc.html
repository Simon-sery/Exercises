<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gæt mit tal</title>

    <link rel="stylesheet" href="pc.css" />
  </head>

  <body>
    <main>
      <h1>Jeg gætter dit tal</h1>

      <p>Tænk på et tal mellem 0 og 100</p>

      <button id="startButton">Start spil</button>

      <h2 id="guess">?</h2>

      <div>
        <button id="tooLowButton">For lavt</button>
        <button id="correctButton">Rigtigt</button>
        <button id="tooHighButton">For højt</button>
      </div>
      <p id="message"></p>
    </main>

    <script src="pc.js"></script>
  </body>
</html>
